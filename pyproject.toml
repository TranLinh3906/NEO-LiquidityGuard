[project]
name = "liquidityguard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2025.1.31",
    "python-dotenv>=1,<2",
    "ssi-sdk>=3.3.2,<4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2"
]
app = [
    "streamlit>=1.49,<2",
    "plotly>=5.24,<7"
]
ui-test = ["playwright>=1.49,<2"]

[tool.setuptools.package-data]
app = ["assets/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
